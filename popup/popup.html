<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Media Timer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Таймер сна</h1>
    
    <div class="presets">
      <button class="preset" data-min="5">5 мин</button>
      <button class="preset" data-min="10">10 мин</button>
      <button class="preset" data-min="15">15 мин</button>
      <button class="preset" data-min="30">30 мин</button>
      <button class="preset" data-min="60">60 мин</button>
    </div>

    <div class="custom-input">
      <input type="number" id="custom-min" placeholder="Свое время (мин)" min="1" max="600">
      <button id="btn-start-custom">Старт</button>
    </div>

    <div id="active-timer" class="hidden">
      <p>Осталось: <span id="time-left">00:00</span></p>
      <button id="btn-cancel" class="btn-danger">Отменить таймер</button>
    </div>
  </div>
  
  <script src="popup.js" type="module"></script>
</body>
</html>
